<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>TestNexa</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Tabler v1.5.1 CSS (ADR-0053 Phase 1 install, ADR-0054 Phase 2 cascade flip) — placed
         AFTER the module script above, i.e. after Vite injects main.tsx's own CSS imports
         (AdminLTE, which bundles all of Bootstrap 5 itself, plus Font Awesome). A later
         stylesheet in document order wins conflicting selectors, so this ordering is what
         makes Tabler win project-wide, per ADR-0054's explicit decision — AdminLTE remains
         live only for screens ADR-0054 didn't touch, and now renders with Tabler's own
         tokens on shared classes (.card/.btn/.table/grid) until each screen migrates. -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.5.1/dist/css/tabler.min.css" />
    <!-- Tabler v1.5.1 JS (ADR-0053, Phase 1) — not vendored as the driver of any interactive
         state (ADR-0054 keeps that React-owned, see AppSidebar/AppHeader), loaded only because
         ADR-0053 already committed to loading it. -->
    <script src="https://cdn.jsdelivr.net/npm/@tabler/core@1.5.1/dist/js/tabler.min.js"></script>
  </body>
</html>
