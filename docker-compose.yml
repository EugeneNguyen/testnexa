# TestNexa Docker Compose topology (ADR-0010: single external port, dev+prod
# profiles in one file — not two separate compose files).
#
# Usage:
#   docker compose --profile dev  up --build   # local dev: Vite dev server + hot reload
#   docker compose --profile prod up --build   # prod-like: static frontend build served by nginx
#
# In both profiles, nginx is the *only* service that publishes a host port
# (54593 -> 80). Every other service is reachable only on the internal
# compose network, by service name.

services:
  # ---------------------------------------------------------------------
  # Postgres — primary application database.
  # ---------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: testnexa
      POSTGRES_USER: testnexa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-testnexa_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testnexa -d testnexa"]
      interval: 5s
      timeout: 5s
      retries: 10
    profiles: ["dev", "prod"]

  # ---------------------------------------------------------------------
  # Postgres — dedicated database for the backend's integration test suite.
  # Idle (no traffic) until that suite is actually run against it.
  # ---------------------------------------------------------------------
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: testnexa_test
      POSTGRES_USER: testnexa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-testnexa_dev_password}
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testnexa -d testnexa_test"]
      interval: 5s
      timeout: 5s
      retries: 10
    profiles: ["dev", "prod"]

  # ---------------------------------------------------------------------
  # Backend — FastAPI app. No host port mapping: nginx is the sole external
  # entrypoint (ADR-0010).
  # ---------------------------------------------------------------------
  backend:
    build:
      context: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ENV: ${ENV:-dev}
      DATABASE_URL: postgresql+asyncpg://testnexa:${POSTGRES_PASSWORD:-testnexa_dev_password}@postgres:5432/testnexa
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
    expose:
      - "8000"
    profiles: ["dev", "prod"]

  # ---------------------------------------------------------------------
  # Frontend (dev profile) — Vite dev server with hot reload. `frontend/src`
  # is bind-mounted so edits on the host are picked up without a rebuild.
  # ---------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      target: dev
    volumes:
      - ./frontend/src:/app/src
    environment:
      # Empty on purpose: same-origin via nginx, per the scaffold-verification
      # page's deliberate relative-path fetch of /api/health.
      VITE_API_BASE_URL: ""
    expose:
      - "5173"
    profiles: ["dev"]

  # ---------------------------------------------------------------------
  # Frontend (prod profile) — one-shot build that copies the Vite static
  # build output (`/app/dist`) into the `frontend_dist` named volume, which
  # nginx-prod mounts read-only as its document root. This service runs to
  # completion and exits; it is not a long-running container.
  # ---------------------------------------------------------------------
  frontend-build:
    build:
      context: ./frontend
      target: build
    volumes:
      - frontend_dist:/dist_output
    command: ["sh", "-c", "rm -rf /dist_output/* && cp -r /app/dist/. /dist_output/"]
    profiles: ["prod"]

  # ---------------------------------------------------------------------
  # nginx (dev profile) — reverse-proxies to the Vite dev server + backend.
  # ---------------------------------------------------------------------
  nginx-dev:
    image: nginx:alpine
    depends_on:
      - backend
      - frontend
    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "54593:80"
    profiles: ["dev"]

  # ---------------------------------------------------------------------
  # nginx (prod profile) — serves the static frontend build directly and
  # reverse-proxies API calls to the backend.
  # ---------------------------------------------------------------------
  nginx-prod:
    image: nginx:alpine
    depends_on:
      backend:
        condition: service_started
      frontend-build:
        condition: service_completed_successfully
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - frontend_dist:/usr/share/nginx/html:ro
    ports:
      - "54593:80"
    profiles: ["prod"]

volumes:
  postgres_data:
  postgres_test_data:
  frontend_dist:
