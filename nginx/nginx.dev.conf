# nginx reverse proxy — dev profile (ADR-0010).
#
# Routes:
#   /api/health -> backend's unprefixed GET /health (naming-mismatch fix
#                  between the independently-built frontend/backend scaffolds)
#   /api/*      -> backend, passthrough for future /api/v1/... feature routes
#   /mcp/*      -> backend, passthrough for MCP-1/ADR-0033's Streamable-HTTP
#                  MCP server (mounted at /mcp on the FastAPI app)
#   /*          -> Vite dev server, with WebSocket upgrade headers for HMR

server {
    listen 80;
    server_name _;

    location /api/health {
        proxy_pass http://backend:8000/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /mcp/ {
        proxy_pass http://backend:8000/mcp/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Streamable-HTTP can return SSE-style streamed responses; turn off
        # any nginx response buffering so the MCP client receives tool output
        # as it streams rather than in one buffered chunk.
        proxy_buffering off;
    }

    location / {
        proxy_pass http://frontend:5173/;
        proxy_http_version 1.1;

        # WebSocket upgrade support required by Vite's dev-server HMR.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
