# nginx reverse proxy + static server — prod profile (ADR-0010).
#
# Routes:
#   /api/health -> backend's unprefixed GET /health (naming-mismatch fix
#                  between the independently-built frontend/backend scaffolds)
#   /api/*      -> backend, passthrough for future /api/v1/... feature routes
#   /*          -> static frontend build (frontend_dist volume), SPA fallback

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/health {
        proxy_pass http://backend:8000/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri /index.html;
    }
}
